comanche.simulator {
  random-seed = 20261008
  start-time = "2026-10-08T00:00:00Z"
  tick-interval = 1 second
  telemetry-interval-ticks = 5
  status-interval-ticks = 30
  kiosk-count = 2
  device-id-prefix = "KIOSK-TAM-"
  first-device-number = 1
  site-id = "SITE-TAMPINES"
  publisher-buffer-capacity = 1000
  publication-max-attempts = 5
  publication-initial-backoff = 250 milliseconds
  publication-max-backoff = 30 seconds
  mqtt {
    server-uri = "tcp://localhost:1883"
    connection-timeout = 10 seconds
    keep-alive-interval = 30 seconds
  }
  fault-scenarios = [
    {
      scenario-id = "PRINTER-DEMO-001"
      device-id = "KIOSK-TAM-001"
      fault-type = "PRINTER_OVERHEATING"
      start-after-ticks = 60
      step-per-tick = 3.0
      maximum = 82.0
      recovery-step-per-tick = 5.0
      disabling-threshold = 72.0
      secondary-step-per-tick = 0.03
      secondary-maximum = 0.25
      secondary-recovery-step-per-tick = 0.05
    },
    {
      scenario-id = "CPU-DEMO-001"
      device-id = "KIOSK-TAM-002"
      fault-type = "CPU_PRESSURE"
      start-after-ticks = 90
      step-per-tick = 8.0
      maximum = 98.0
      recovery-step-per-tick = 12.0
      disabling-threshold = 95.0
    },
    {
      scenario-id = "MEMORY-DEMO-001"
      device-id = "KIOSK-TAM-002"
      fault-type = "MEMORY_PRESSURE"
      start-after-ticks = 120
      step-per-tick = 6.0
      maximum = 96.0
      recovery-step-per-tick = 10.0
      disabling-threshold = 94.0
    }
  ]
}
