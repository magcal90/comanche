services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "${COMANCHE_KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${COMANCHE_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "${COMANCHE_MQTT_PORT:-1883}:1883"
    environment:
      COMANCHE_MQTT_USERNAME: "${COMANCHE_MQTT_USERNAME:-comanche-local}"
      COMANCHE_MQTT_PASSWORD: "${COMANCHE_MQTT_PASSWORD:-comanche-local}"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mosquitto_passwd -b -c /mosquitto/data/passwords "$${COMANCHE_MQTT_USERNAME}" "$${COMANCHE_MQTT_PASSWORD}"
        chown mosquitto:mosquitto /mosquitto/data/passwords
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        mosquitto_pub -h localhost -p 1883
        -u "$$COMANCHE_MQTT_USERNAME"
        -P "$$COMANCHE_MQTT_PASSWORD"
        -t "comanche/health"
        -m "ping"
        >/dev/null 2>&1
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "${COMANCHE_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${COMANCHE_POSTGRES_DB:-comanche}"
      POSTGRES_USER: "${COMANCHE_POSTGRES_USER:-comanche}"
      POSTGRES_PASSWORD: "${COMANCHE_POSTGRES_PASSWORD:-comanche-local}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  mosquitto-data:
  mosquitto-logs:
  postgres-data:
